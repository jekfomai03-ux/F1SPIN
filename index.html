<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>F1 Club — Case Opening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="case-container">
        <header class="header">
            <h1>F1 Club — Case<br>Opening</h1>
        </header>

        <button type="button" class="logo-badge" id="caseIcon" aria-label="Открыть кейс">
            <img src="logo-clean.png" alt="F1 Computer Club" width="240" height="240">
        </button>

        <section class="roulette-section" aria-label="Рулетка призов">
            <div class="roulette-wrapper">
                <div class="roulette-indicator"></div>
                <div class="roulette-viewport" id="rouletteViewport">
                    <div class="roulette-track" id="rouletteTrack"></div>
                </div>
            </div>
        </section>

        <button class="open-btn" id="openCaseBtn" type="button">🔓 Открыть кейс</button>

        <div class="prizes-legend" id="prizesLegend"></div>
    </main>

    <div class="win-sheet" id="winSheet" hidden>
        <button type="button" class="win-sheet-backdrop" id="winSheetClose" aria-label="Закрыть"></button>
        <section class="win-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-live="polite">
            <div class="win-sheet-handle" aria-hidden="true"></div>
            <div class="result-title" id="resultTitle">🎉 Ваш приз:</div>
            <div class="result-prize" id="resultPrize"></div>
            <button type="button" class="win-sheet-ok" id="winSheetOk">Ок</button>
        </section>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
